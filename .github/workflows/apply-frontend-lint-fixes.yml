name: Apply frontend lint fixes probe

on:
  push:
    branches:
      - activate-frontend-lint-gates

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply Stylelint fixes
        run: pnpm lint:css:fix
      - name: Apply Prettier fixes
        run: pnpm lint:prettier:fix
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo "No lint fixes needed"
            exit 0
          fi

          git config user.email "ci@ci.invalid"
          git config user.name "Discourse CI"
          git add assets test
          git commit -m "Apply frontend lint formatting"
          git push origin HEAD:${GITHUB_REF_NAME}
