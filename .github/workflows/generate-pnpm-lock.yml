name: Generate pnpm lockfile probe

on:
  push:
    branches:
      - activate-frontend-lint-gates

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate
      - name: Generate lockfile
        run: pnpm install --lockfile-only
      - name: Commit lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml && git ls-files --error-unmatch pnpm-lock.yaml >/dev/null 2>&1; then
            echo "pnpm-lock.yaml is already current"
            exit 0
          fi

          git config user.email "ci@ci.invalid"
          git config user.name "Discourse CI"
          git add pnpm-lock.yaml
          git commit -m "Generate pnpm lockfile"
          git push origin HEAD:${GITHUB_REF_NAME}
